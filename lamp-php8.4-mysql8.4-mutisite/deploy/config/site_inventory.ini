# deploy/config/site_inventory.ini
#
# one section per site. the section name IS the website_id, e.g. [site1]
# site tree on disk is only derived from that name: /home/<website_id>/ (never configured as a static path)
# apache documentroot: /home/<website_id>/<docroot_subdir>  (default public_html)
#
# recommended key order inside each section:
#   active first (easy to scan what is deployed), then domain, repo_folder, branch, docroot_subdir, ssl, certbot_email
#
# required: domain, repo_folder, branch, active
# optional: docroot_subdir (default public_html), ssl, certbot_email
#
# active=no: skipped for deploy/provision; if purge_inactive=yes, next run removes cert (certbot),
#   apache vhosts for this id (+ typical certbot *-le-ssl.conf), and /home/<website_id>.
# if a section is removed entirely but a vhost file remains, that id is treated as orphan and torn down the same way.
#
# database: deploy/config/db_inventory.ini
#
# note: do not use keys website_id= or live_directory=

[site1]
active=yes
domain=example.com
repo_folder=site1-app
branch=main
docroot_subdir=public_html
ssl=no
certbot_email=admin@example.com

[site2]
active=yes
domain=example2.com
repo_folder=site2-portal
branch=main
docroot_subdir=public_html
ssl=no
certbot_email=admin@example.com

[site3]
active=no
domain=example3.com
repo_folder=site3-blog
branch=dev
docroot_subdir=public_html
ssl=no
certbot_email=admin@example.com
