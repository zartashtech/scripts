# deploy/config/settings.conf
#
# main configuration for the deployment system
#
# naming rule: use small letters for variables (required by your spec)
#
# IMPORTANT:
# - this deployment repository can be public
# - your websites repository is private, so SSH auth must be configured

# --- github repo (private monorepo) ---

# ssh url for the private websites repo
# examples:
#   github_repo_ssh_url="git@github.com:myorg/private-websites.git"
#   github_repo_ssh_url="git@github-myprivaterepo:myorg/private-websites.git"  # if you use an ssh host alias
github_repo_ssh_url="git@github.com:yourorg/your-private-websites-repo.git"

# local clone/cache path on the server (kept for future resync)
local_repo_path="/opt/deploy/repo"

# optional: a default branch to use for the initial clone (per-site branches come from inventory)
repo_default_branch="main"

# --- inventory ---

# site list: section name = website_id; live dir = /home/<website_id>
inventory_file="deploy/config/site_inventory.ini"

# separate db inventory (recommended when a few dbs are shared by many sites)
db_inventory_file="deploy/config/db_inventory.ini"

# one private key on staging used for ALL [source:*] ssh connections in db_inventory.ini (db pull).
# run: sudo bash deploy/scripts/ssh_db_bootstrap.sh  (creates key + tests hosts)
# set empty to use default ssh-agent / ~/.ssh/id_* instead
ssh_db_identity_file="/root/.ssh/db_pull_ed25519"

# when yes: deploy.sh / site_provision.sh remove apache vhost + /home/<website_id> for every active=no site
# set no to keep inactive sites on disk (no delete)
purge_inactive="yes"   # yes/no

# --- rsync behavior ---

# safe by default: do not delete live files unless explicitly enabled
enable_delete="no"     # yes/no

# create the live directory if missing
create_live_dirs="yes" # yes/no

# extra rsync options (keep simple and safe)
# -a : archive mode (preserves permissions, times, symlinks where possible)
# -z : compression (optional)
# --itemize-changes : helpful logs
rsync_base_opts="-a --itemize-changes"

# optional: exclude file path
# if empty, only the built-in excludes apply (like .git)
exclude_file=""

# --- runtime modes ---

# when yes, commands are printed and rsync runs with -n (no changes)
dry_run="no"           # yes/no

# when yes, prints more output to stdout (logs always record everything)
verbose="no"           # yes/no

# --- paths inside this deployment project ---

# these are relative to the repo root where you run deploy/scripts/deploy.sh
logs_dir="deploy/logs"
tmp_dir="deploy/tmp"

