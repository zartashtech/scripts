# deploy/config/db_inventory.ini
#
# shared database inventory for staging (ini-style)
#
# why separate file?
# - you said only 4-5 databases are shared by multiple websites
# - keeping db details in the site inventory would duplicate values and cause mistakes
#
# sections:
# - [local_db:<name>]     : local db + mysql user(s) on staging
#       use db_user=single   OR   db_users=user1,user2,user3  (comma-separated, same db, each gets ALL on that db)
# - [source:<name>]       : a live server that can provide dumps via ssh
# - [map:<name>]          : mapping from source db -> local db
#
# IMPORTANT SECURITY NOTES
# - do NOT store mysql passwords in this file
# - on live servers, use /root/.my.cnf and sudo for mysqldump
# - on staging, use /root/.my.cnf for local mysql

# --- local dbs (staging) ---

[local_db:main_app]
db_name=main_app
db_host=localhost
db_users=main_app_user,main_app_readonly,main_app_cron
db_create=yes

[local_db:shared_auth]
db_name=shared_auth
db_host=localhost
db_user=shared_auth_user
db_create=yes

# --- source servers (live) ---
# ssh: one key on staging (settings: ssh_db_identity_file). setup:
#   sudo bash deploy/scripts/ssh_db_bootstrap.sh
# on each source, as ssh_user: run deploy/scripts/remote_ssh_connect_provision.sh and paste the pubkey line.

[source:prod1]
ssh_host=prod1.example.com
ssh_user=root
ssh_port=22
mysql_defaults_file=/root/.my.cnf
sudo_mysqldump=yes

# --- mapping (source -> local) ---

[map:main_app_from_prod1]
enabled=yes
local_db=main_app
source=prod1
source_db=main_app

[map:shared_auth_from_prod1]
enabled=no
local_db=shared_auth
source=prod1
source_db=shared_auth

